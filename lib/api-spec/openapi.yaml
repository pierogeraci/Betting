openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CTI Gambling Intelligence API — manual and authorized-source prototype.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Dashboard, current user and audit activity
  - name: sources
    description: Source registry and authorization review
  - name: evidence
    description: Manual evidence intake, classification and normalization
  - name: sites
    description: Betting-site profiles and analyst-confirmed entity links
  - name: entities
    description: Legal entities and candidate associations
  - name: events
    description: Sports event fraud-risk assessment
  - name: bettors
    description: Restricted, authorized or synthetic bettor profiles
  - name: trust
    description: Provisional Trust Index calculation
  - name: exports
    description: Excel workbook extraction
  - name: storage
    description: Private evidence and authorization-document uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getSession
      tags: [workspace]
      summary: Get the authenticated user's application role
      responses:
        "200":
          description: Current application identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [workspace]
      summary: Get dashboard totals and risk breakdowns
      responses:
        "200":
          description: Workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [workspace]
      summary: List recent audit activity
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recent activity records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
  /users:
    get:
      operationId: listUsers
      tags: [workspace]
      summary: List workspace members and assigned roles
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{userId}/role:
    patch:
      operationId: updateUserRole
      tags: [workspace]
      summary: Assign a workspace role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceUser"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: Search and filter registered sources
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: legalStatus
          in: query
          schema:
            $ref: "#/components/schemas/SourceLegalStatus"
        - name: connectorStatus
          in: query
          schema:
            $ref: "#/components/schemas/ConnectorStatus"
      responses:
        "200":
          description: Source registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceList"
    post:
      operationId: createSource
      tags: [sources]
      summary: Register an authorized-source candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "201":
          description: Source registered in draft state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sources/{id}:
    get:
      operationId: getSource
      tags: [sources]
      summary: Get source authorization details
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Source record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSource
      tags: [sources]
      summary: Update a source while retaining its review state
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceUpdate"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /sources/{id}/review:
    post:
      operationId: reviewSource
      tags: [sources]
      summary: Approve, reject, suspend or revoke source access
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceReview"
      responses:
        "200":
          description: Review decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /evidence:
    get:
      operationId: listEvidence
      tags: [evidence]
      summary: Search and filter evidence records
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EvidenceStatus"
      responses:
        "200":
          description: Evidence records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceList"
    post:
      operationId: createEvidence
      tags: [evidence]
      summary: Capture evidence manually or from an approved source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Evidence captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /evidence/{id}:
    get:
      operationId: getEvidence
      tags: [evidence]
      summary: Get an evidence record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Evidence record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEvidence
      tags: [evidence]
      summary: Update extraction, normalization or enrichment fields
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUpdate"
      responses:
        "200":
          description: Updated evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404":
          $ref: "#/components/responses/NotFound"
  /evidence/{id}/classify:
    post:
      operationId: classifyEvidence
      tags: [evidence]
      summary: Save analyst-reviewed classification and normalized fields
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceClassification"
      responses:
        "200":
          description: Classification saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "404":
          $ref: "#/components/responses/NotFound"
  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: Search and filter betting-site profiles
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: riskBand
          in: query
          schema:
            $ref: "#/components/schemas/RiskBand"
      responses:
        "200":
          description: Betting sites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a betting-site record from authorized evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
  /sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a betting-site profile
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Site profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update site profile fields
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          $ref: "#/components/responses/NotFound"
  /sites/{id}/profile:
    get:
      operationId: getSiteProfile
      tags: [sites]
      summary: Get combined site profile, evidence and latest scores
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Combined analyst profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteProfile"
        "404":
          $ref: "#/components/responses/NotFound"
  /sites/{id}/entity-link:
    post:
      operationId: linkSiteEntity
      tags: [sites]
      summary: Confirm an analyst-reviewed legal-entity association
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityLinkInput"
      responses:
        "200":
          description: Association recorded with analyst decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          $ref: "#/components/responses/NotFound"
  /entities:
    get:
      operationId: listEntities
      tags: [entities]
      summary: Search legal-entity candidate records
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Legal entities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityList"
    post:
      operationId: createEntity
      tags: [entities]
      summary: Create a legal-entity or person candidate record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityInput"
      responses:
        "201":
          description: Candidate entity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Search sports events and risk ratings
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: riskBand
          in: query
          schema:
            $ref: "#/components/schemas/RiskBand"
      responses:
        "200":
          description: Sports events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
    post:
      operationId: createEvent
      tags: [events]
      summary: Register a sports event for analyst assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsEvent"
  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get sports-event details and rating inputs
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsEvent"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update event market observations
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsEvent"
        "404":
          $ref: "#/components/responses/NotFound"
  /events/{id}/rate:
    post:
      operationId: rateEvent
      tags: [events]
      summary: Calculate an event risk rating from supplied market data
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRatingInput"
      responses:
        "200":
          description: Risk rating calculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
  /bettors:
    get:
      operationId: listBettors
      tags: [bettors]
      summary: Search restricted synthetic or authorized bettor profiles
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Pseudonymous bettor profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BettorList"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createBettor
      tags: [bettors]
      summary: Add an authorized or synthetic pseudonymous bettor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BettorInput"
      responses:
        "201":
          description: Pseudonymous profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BettorProfile"
        "403":
          $ref: "#/components/responses/Forbidden"
  /trust/matrix:
    get:
      operationId: getTrustMatrix
      tags: [trust]
      summary: Read the approved provisional scoring weights and thresholds
      responses:
        "200":
          description: Scoring methodology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustMatrix"
  /trust/scores:
    get:
      operationId: listTrustScores
      tags: [trust]
      summary: List calculated site Trust Index scores
      parameters:
        - name: siteId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Trust Index results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustScoreList"
  /trust/scores/calculate:
    post:
      operationId: calculateTrustScore
      tags: [trust]
      summary: Calculate vulnerability, threat and normalized Trust Index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustCalculationInput"
      responses:
        "201":
          description: Score calculated and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustScore"
        "400":
          $ref: "#/components/responses/BadRequest"
  /exports/xlsx:
    get:
      operationId: downloadWorkbook
      tags: [exports]
      summary: Download a multi-sheet Excel extraction
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [all, sources, evidence, sites, events, bettors, trust, audit]
            default: all
        - name: includeRestricted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private upload URL for an authorized evidence file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [storage]
      summary: Serve a public asset from the configured public storage paths
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public object bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Sign-in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Role or authorization does not permit this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required: [error]
    RiskBand:
      type: string
      enum: [low, medium, high, unassessed]
    SourceLegalStatus:
      type: string
      enum: [draft, in_review, approved, rejected, expired, revoked, suspended]
    ConnectorStatus:
      type: string
      enum: [not_configured, connected, error, off]
    EvidenceStatus:
      type: string
      enum: [new, classified, normalized, reviewed, archived]
    WorkspaceRole:
      type: string
      enum: [admin, analyst, compliance_reviewer, restricted_analyst, read_only]
    Session:
      type: object
      required: [authenticated, userId, displayName, role, accessState]
      properties:
        authenticated: { type: boolean }
        userId: { type: string }
        displayName: { type: string }
        email: { type: ["string", "null"] }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        accessState:
          type: string
          enum: [active, pending, disabled, setup_required]
    WorkspaceUser:
      type: object
      required: [id, userId, displayName, role, status, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        displayName: { type: string }
        email: { type: ["string", "null"] }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        status:
          type: string
          enum: [active, pending, disabled]
        createdAt: { type: string, format: date-time }
    UserList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkspaceUser" } }
        total: { type: integer }
    UserRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    DashboardSummary:
      type: object
      required: [sourceCount, sourcesInReview, approvedSources, evidenceCount, unclassifiedEvidence, siteCount, highRiskSites, eventCount, highRiskEvents, restrictedBettorCount, generatedAt]
      properties:
        sourceCount: { type: integer }
        sourcesInReview: { type: integer }
        approvedSources: { type: integer }
        evidenceCount: { type: integer }
        unclassifiedEvidence: { type: integer }
        siteCount: { type: integer }
        highRiskSites: { type: integer }
        eventCount: { type: integer }
        highRiskEvents: { type: integer }
        restrictedBettorCount: { type: integer }
        generatedAt: { type: string, format: date-time }
    Activity:
      type: object
      required: [id, action, entityType, entityLabel, actorLabel, createdAt]
      properties:
        id: { type: integer }
        action: { type: string }
        entityType: { type: string }
        entityLabel: { type: string }
        actorLabel: { type: string }
        createdAt: { type: string, format: date-time }
    ActivityList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        total: { type: integer }
    Source:
      type: object
      required: [id, name, provider, category, accessMethod, owner, purpose, scope, dataCategories, authorizationBasis, validFrom, legalStatus, connectorStatus, connectorScopes, secretReference, ingestionAllowed, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        provider: { type: string }
        url: { type: ["string", "null"] }
        category: { type: string }
        accessMethod: { type: string }
        owner: { type: string }
        purpose: { type: string }
        scope: { type: string }
        dataCategories: { type: array, items: { type: string } }
        authorizationBasis: { type: string }
        authorizationEvidenceName: { type: ["string", "null"] }
        authorizationEvidencePath: { type: ["string", "null"] }
        validFrom: { type: string, format: date }
        validUntil: { type: ["string", "null"], format: date }
        reviewerRole: { type: ["string", "null"] }
        reviewerLabel: { type: ["string", "null"] }
        legalStatus:
          $ref: "#/components/schemas/SourceLegalStatus"
        connectorStatus:
          $ref: "#/components/schemas/ConnectorStatus"
        connectorScopes: { type: array, items: { type: string } }
        secretReference: { type: string, description: "Vault reference only; never a credential value." }
        reviewNote: { type: ["string", "null"] }
        ingestionAllowed: { type: boolean, description: "True only when current approved authorization permits manual evidence referencing. It does not indicate or enable an automated connector." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SourceInput:
      type: object
      required: [name, provider, category, accessMethod, owner, purpose, scope, dataCategories, authorizationBasis, validFrom, connectorScopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        provider: { type: string, minLength: 1, maxLength: 160 }
        url: { type: ["string", "null"], maxLength: 2048 }
        category: { type: string, minLength: 1, maxLength: 100 }
        accessMethod: { type: string, minLength: 1, maxLength: 100 }
        owner: { type: string, minLength: 1, maxLength: 160 }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
        scope: { type: string, minLength: 1, maxLength: 1000 }
        dataCategories: { type: array, items: { type: string }, minItems: 1 }
        authorizationBasis: { type: string, minLength: 1, maxLength: 1000 }
        authorizationEvidenceName: { type: ["string", "null"] }
        authorizationEvidencePath: { type: ["string", "null"] }
        validFrom: { type: string, format: date }
        validUntil: { type: ["string", "null"], format: date }
        reviewerRole: { type: ["string", "null"] }
        connectorScopes: { type: array, items: { type: string } }
        secretReference: { type: string, default: "" }
    SourceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        provider: { type: string, minLength: 1, maxLength: 160 }
        url: { type: ["string", "null"], maxLength: 2048 }
        category: { type: string }
