# DEROGA AL VINCOLO 7, SOLO PER LE SESSIONI CLOUD: il contenitore di raccolta usa la rete
# dell'host perché il proxy della sessione ascolta su 127.0.0.1 e non è raggiungibile da una
# rete Docker. Su questa rete il contenitore vede le porte locali dell'host: la difesa resta
# la guardia sugli indirizzi (probes/snapshot/guard.py) più il controllo dei reindirizzamenti.
# Non usarlo fuori dalla sessione cloud.
#
# Aggiunta per le sessioni cloud di Claude Code, dove la rete passa da un proxy che
# sostituisce i certificati. Non serve su una macchina normale.
#   BUILDX_BAKE_ENTITLEMENTS_FS=0 docker compose -f compose.yaml -f compose.sessione.yaml ...
# oppure: make <comando> COMPOSE_EXTRA="-f compose.sessione.yaml"
# Effetti: le immagini si costruiscono con la CA del proxy; il contenitore di raccolta
# usa la rete dell'host per raggiungere il proxy e marca gli snapshot come
# `rete_intercettata`, quindi le evidenze sui certificati TLS non sono valide.
x-ca: &ca
  secrets: [ca]

services:
  init: {build: *ca}
  portale: {build: *ca}
  lavoratore: {build: *ca}
  raccolta:
    build: *ca
    network_mode: host
    networks: !reset []
    environment:
      RACCOLTA_DATABASE_URL: postgresql://raccolta:${RACCOLTA_DB_PASSWORD}@127.0.0.1:${PORTA_DB:-5432}/${POSTGRES_DB:-betting}
      S3_ENDPOINT: http://127.0.0.1:${PORTA_ARCHIVIO:-8333}
      RACCOLTA_PROXY: ${HTTPS_PROXY:-}
      RETE_INTERCETTATA: "true"
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1
      SSL_CERT_FILE: /ca.crt
    volumes: ["${CA_SESSIONE:-/root/.ccr/ca-bundle.crt}:/ca.crt:ro"]

secrets:
  ca:
    file: ${CA_SESSIONE:-/root/.ccr/ca-bundle.crt}
