kind = "web"
previewPath = "/"
title = "CTI Gambling Intelligence"
description = "Portale CTI Softstrategy per acquisire evidenze, confrontarle con gli elenchi ADM, profilare siti ed eventi e scaricare report Excel."
version = "1.0.0"
id = "artifacts/cti-gambling-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18855

[services.development]
run = "cd python_app && python3.12 -m uvicorn console.app:app --host 0.0.0.0 --port $PORT --proxy-headers"

[services.production.build]
args = [ "python3.12", "-m", "compileall", "-q", "python_app" ]

[services.production.run]
args = [ "python3.12", "-m", "uvicorn", "console.app:app", "--host", "0.0.0.0", "--port", "18855", "--proxy-headers" ]

[services.production.run.env]
PORT = "18855"
BASE_PATH = "/"
COOKIE_SICURI = "true"
PYTHONPATH = "python_app"

[services.production.health.startup]
path = "/salute"

[services.env]
PORT = "18855"
BASE_PATH = "/"
COOKIE_SICURI = "true"
PYTHONPATH = "python_app"
