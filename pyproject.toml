[project]
name = "betting"
version = "0.1.0"
description = "Ricerca e analisi dei siti di scommesse illegali"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "tldextract>=5.1",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "dnspython>=2.6",
]

[project.optional-dependencies]
# Dipendenze del contenitore di raccolta: niente SQLAlchemy, niente portale.
raccolta = ["playwright==1.65.2", "dnspython>=2.6", "telethon>=1.36", "scrapy>=2.11", "scrapy-playwright>=0.0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "telethon>=1.36", "scrapy>=2.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "probes", "probes.snapshot", "probes.adm", "probes.rete", "probes.telegram", "probes.web", "console", "console.routes", "extractors", "collectors", "scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: prove su dati reali, eseguite solo da make test-integration"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore::DeprecationWarning:starlette.testclient"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"migrations/*" = ["S608"]
