[project]
name = "cti-replit-runtime"
version = "0.1.0"
description = "Runtime dependencies for the CTI Python portal."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.34",
    "dnspython>=2.6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "imagehash>=4.3",
    "jinja2>=3.1",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "pillow>=10",
    "psycopg[binary]>=3.2",
    "pytest>=8",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "replit-object-storage>=1.0.2",
    "scikit-learn>=1.4",
    "sqlalchemy>=2.0,<2.2",
    "tldextract>=5.1",
    "uvicorn>=0.30",
]

[tool.uv]
package = false
